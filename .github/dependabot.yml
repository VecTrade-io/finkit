version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      runtime:
        patterns:
          - "numpy"
          - "pandas"
      dev-tools:
        patterns:
          - "pytest*"
          - "ruff"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
