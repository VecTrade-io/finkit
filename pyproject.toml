[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vectrade-finkit"
version = "1.0.0"
description = "Open-source financial indicators, signals, and risk models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "VecTrade", email = "oss@vectrade.io" }]
keywords = ["finance", "trading", "indicators", "risk", "signals", "quant", "backtesting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/finkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=finkit --cov-report=term-missing --cov-branch"

[tool.coverage.run]
source = ["finkit"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[project.urls]
Homepage = "https://github.com/VecTrade-io/finkit"
Documentation = "https://docs.vectrade.io/sdks/finkit"
Repository = "https://github.com/VecTrade-io/finkit"
Changelog = "https://github.com/VecTrade-io/finkit/blob/main/CHANGELOG.md"
Issues = "https://github.com/VecTrade-io/finkit/issues"
