[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vectrade-finkit"
version = "0.1.0"
description = "Open-source financial indicators, signals, and risk models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "VecTrade", email = "oss@vectrade.io" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/finkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=finkit --cov-report=term-missing --cov-branch"

[tool.coverage.run]
source = ["finkit"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
